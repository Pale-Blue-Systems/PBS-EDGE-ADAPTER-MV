name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install pytest cbor2 git+https://github.com/Pale-Blue-Systems/PBS_LINK.git
      - name: Run tests
        run: pytest -q
      - name: Run worked example
        run: python pbs_edge_adapter_worked_example.py
